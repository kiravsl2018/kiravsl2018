<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Miguel - SysAdmin, Homelabber y DAW Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset=".55" stop-color="#16103a"/><stop offset="1" stop-color="#1e1147"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/>
      <animate attributeName="x1" values="0;.6;0" dur="7s" repeatCount="indefinite"/><animate attributeName="x2" values="1;1.6;1" dur="7s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <radialGradient id="core"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".9"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8b5cf6" stroke-opacity=".11"/></pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="c"><rect x="2" y="2" width="996" height="296" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="300" fill="url(#bg)"/><rect width="1000" height="300" fill="url(#grid)"/>
    <circle cx="110" cy="50" r="90" fill="#3b82f6" fill-opacity=".12"><animate attributeName="cy" values="50;80;50" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="290" r="120" fill="#ec4899" fill-opacity=".07"><animate attributeName="cx" values="560;600;560" dur="11s" repeatCount="indefinite"/></circle>
    <!-- línea de escaneo -->
    <rect x="0" y="0" width="1000" height="2" fill="#8b5cf6" fill-opacity=".35"><animate attributeName="y" values="0;300" dur="6s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="2" y="2" width="996" height="296" rx="20" fill="none" stroke="url(#border)" stroke-width="2"/>

  <!-- órbita -->
  <g transform="translate(780 150)">
    <circle r="70" fill="url(#core)" opacity=".35"><animate attributeName="r" values="60;78;60" dur="4s" repeatCount="indefinite"/></circle>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/><circle r="62" fill="none" stroke="#8b5cf6" stroke-opacity=".35" stroke-dasharray="4 8"/><circle cx="62.0" cy="0.0" r="5" fill="#3b82f6"/><circle cx="-31.0" cy="53.7" r="5" fill="#ec4899"/><circle cx="-31.0" cy="-53.7" r="5" fill="#22c55e"/></g>
    <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/><circle r="104" fill="none" stroke="#8b5cf6" stroke-opacity=".35" stroke-dasharray="4 8"/><circle cx="104.0" cy="0.0" r="5" fill="#8b5cf6"/><circle cx="32.1" cy="98.9" r="5" fill="#f59e0b"/><circle cx="-84.1" cy="61.1" r="5" fill="#3b82f6"/><circle cx="-84.1" cy="-61.1" r="5" fill="#06b6d4"/><circle cx="32.1" cy="-98.9" r="5" fill="#ec4899"/></g>
    <circle r="38" fill="#0d1117" stroke="url(#border)" stroke-width="2.5"/>
    <text y="8" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="700" fill="#e6edf3">~$<tspan fill="#8b5cf6">_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
  </g>
  
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4s" begin="0s" repeatCount="indefinite"/>
      <rect x="604" y="57" width="72" height="26" rx="13" fill="#3b82f6" fill-opacity=".16" stroke="#3b82f6" stroke-opacity=".7"/>
      <text x="640" y="75" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e6edf3">Docker</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4s" begin="0.8s" repeatCount="indefinite"/>
      <rect x="874" y="65" width="61" height="26" rx="13" fill="#f59e0b" fill-opacity=".16" stroke="#f59e0b" stroke-opacity=".7"/>
      <text x="905" y="83" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e6edf3">Linux</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4s" begin="1.6s" repeatCount="indefinite"/>
      <rect x="588" y="209" width="53" height="26" rx="13" fill="#ec4899" fill-opacity=".16" stroke="#ec4899" stroke-opacity=".7"/>
      <text x="615" y="227" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e6edf3">Java</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4s" begin="2.4s" repeatCount="indefinite"/>
      <rect x="871" y="219" width="58" height="26" rx="13" fill="#06b6d4" fill-opacity=".16" stroke="#06b6d4" stroke-opacity=".7"/>
      <text x="900" y="237" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e6edf3">UniFi</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4s" begin="1.2s" repeatCount="indefinite"/>
      <rect x="905" y="139" width="71" height="26" rx="13" fill="#22c55e" fill-opacity=".16" stroke="#22c55e" stroke-opacity=".7"/>
      <text x="940" y="157" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e6edf3">MySQL</text></g>

  <g font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">
    <text x="60" y="58" font-size="15"><tspan fill="#22c55e">miguel@homelab</tspan><tspan fill="#7c8db5">:~$ whoami</tspan></text>
    <text x="56" y="152" font-size="92" font-weight="700" fill="url(#title)" filter="url(#glow)" letter-spacing="5">MIGUEL<animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/></text>
  </g>
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600">
    <rect x="60" y="176" width="118" height="34" rx="9" fill="#3b82f6" fill-opacity=".18" stroke="#3b82f6" stroke-opacity=".7"/>
    <text x="119" y="200" text-anchor="middle" fill="#bcd4ff" font-size="17">SysAdmin</text>
    <text x="190" y="200" fill="#64748b" font-size="17">·</text>
    <rect x="206" y="176" width="140" height="34" rx="9" fill="#8b5cf6" fill-opacity=".18" stroke="#8b5cf6" stroke-opacity=".7"/>
    <text x="276" y="200" text-anchor="middle" fill="#ddd2ff" font-size="17">Homelabber</text>
    <text x="358" y="200" fill="#64748b" font-size="17">·</text>
    <rect x="374" y="176" width="176" height="34" rx="9" fill="#ec4899" fill-opacity=".16" stroke="#ec4899" stroke-opacity=".7"/>
    <text x="462" y="200" text-anchor="middle" fill="#ffc2de" font-size="17">DAW Developer</text>
  </g>
  <g font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">
    <text x="62" y="252" font-size="16" fill="#a78bfa">$ docker compose up -d</text>
    <rect x="286" y="238" width="10" height="18" fill="#a78bfa"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.51;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
</svg>
