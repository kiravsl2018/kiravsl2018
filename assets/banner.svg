<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Miguel - SysAdmin, Homelabber y DAW Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#16103a"/>
      <stop offset="100%" stop-color="#1e1147"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
      <animate attributeName="x1" values="0%;60%;0%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;160%;100%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8b5cf6" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="996" height="256" rx="18" fill="url(#bg)" stroke="url(#border)" stroke-width="2"/>
  <rect x="2" y="2" width="996" height="256" rx="18" fill="url(#grid)"/>

  <circle cx="120" cy="60" r="70" fill="#3b82f6" fill-opacity="0.10">
    <animate attributeName="cy" values="60;90;60" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="200" r="90" fill="#ec4899" fill-opacity="0.08">
    <animate attributeName="cy" values="200;170;200" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="50" r="40" fill="#8b5cf6" fill-opacity="0.12">
    <animate attributeName="cx" values="760;800;760" dur="8s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">
    <text x="60" y="48" font-size="15" fill="#7c8db5">
      <tspan fill="#22c55e">miguel@homelab</tspan><tspan fill="#7c8db5">:~$ whoami</tspan>
    </text>

    <text x="60" y="140" font-size="84" font-weight="700" fill="url(#title)" filter="url(#glow)" letter-spacing="4">MIGUEL
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>

    <text x="62" y="186" font-size="22" fill="#e2e8f0" opacity="0">
      SysAdmin  ·  Homelabber  ·  DAW Developer
      <animate attributeName="opacity" values="0;1" begin="1s" dur="1s" fill="freeze"/>
    </text>

    <text x="62" y="226" font-size="16" fill="#a78bfa" opacity="0">
      $ docker compose up -d
      <animate attributeName="opacity" values="0;1" begin="1.8s" dur="0.6s" fill="freeze"/>
    </text>
    <rect x="285" y="212" width="10" height="18" fill="#a78bfa" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.51;1" begin="2.4s" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
