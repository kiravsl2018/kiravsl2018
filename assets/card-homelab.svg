<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" role="img" aria-label="Proyecto: HOMELAB My Own Server">
  <defs>
    <linearGradient id="hbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1f0f1a"/>
    </linearGradient>
    <linearGradient id="hborder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E95420"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="477" height="197" rx="14" fill="url(#hbg)" stroke="url(#hborder)" stroke-width="2"/>
  <circle cx="420" cy="50" r="46" fill="#E95420" fill-opacity="0.10">
    <animate attributeName="r" values="46;52;46" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- icono servidor -->
  <g transform="translate(28 30)">
    <rect x="0" y="0" width="44" height="14" rx="3" fill="none" stroke="#E95420" stroke-width="2"/>
    <rect x="0" y="18" width="44" height="14" rx="3" fill="none" stroke="#E95420" stroke-width="2"/>
    <rect x="0" y="36" width="44" height="14" rx="3" fill="none" stroke="#E95420" stroke-width="2"/>
    <circle cx="36" cy="7" r="2.5" fill="#22c55e"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="25" r="2.5" fill="#22c55e"><animate attributeName="opacity" values="1;0.2;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="36" cy="43" r="2.5" fill="#22c55e"><animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">
    <text x="88" y="46" font-size="20" font-weight="700" fill="#e6edf3">HOMELAB-My-Own-Server</text>
    <text x="88" y="70" font-size="13" fill="#8b949e">Bitácora de mi servidor casero</text>

    <text x="28" y="116" font-size="14" fill="#c9d1d9">Ubuntu Server + Docker: proxy inverso, DNS,</text>
    <text x="28" y="136" font-size="14" fill="#c9d1d9">VPN mesh, backups y todo lo que se rompió.</text>

    <g font-size="12">
      <rect x="28" y="156" width="74" height="24" rx="12" fill="#E95420" fill-opacity="0.18" stroke="#E95420" stroke-opacity="0.6"/>
      <text x="65" y="172" text-anchor="middle" fill="#ffb59a">Ubuntu</text>
      <rect x="110" y="156" width="74" height="24" rx="12" fill="#2496ED" fill-opacity="0.18" stroke="#2496ED" stroke-opacity="0.6"/>
      <text x="147" y="172" text-anchor="middle" fill="#9cd2ff">Docker</text>
      <rect x="192" y="156" width="92" height="24" rx="12" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-opacity="0.6"/>
      <text x="238" y="172" text-anchor="middle" fill="#d4c4ff">Tailscale</text>
      <rect x="292" y="156" width="70" height="24" rx="12" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e" stroke-opacity="0.6"/>
      <text x="327" y="172" text-anchor="middle" fill="#a7f3c4">Kopia</text>
    </g>
    <text x="452" y="174" text-anchor="end" font-size="13" fill="#E95420">ver →</text>
  </g>
</svg>
